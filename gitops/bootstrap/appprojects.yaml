apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: core-infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Enterprise core platform and infrastructure services"
  sourceRepos:
    - "*"
  destinations:
    - namespace: "argocd"
      server: "https://kubernetes.default.svc"
    - namespace: "kube-system"
      server: "https://kubernetes.default.svc"
    - namespace: "ingress-nginx"
      server: "https://kubernetes.default.svc"
    - namespace: "monitoring"
      server: "https://kubernetes.default.svc"
    - namespace: "cert-manager"
      server: "https://kubernetes.default.svc"
    - namespace: "external-dns"
      server: "https://kubernetes.default.svc"
    - namespace: "argo-rollouts"
      server: "https://kubernetes.default.svc"
    - namespace: "external-secrets"
      server: "https://kubernetes.default.svc"
  # Core infrastructure is authorized to manage cluster-scoped resources
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
  roles:
    - name: platform-admin
      description: Read-write privileges for Platform DevOps Engineers
      policies:
        - p, proj:core-infrastructure:platform-admin, applications, *, core-infrastructure/*, allow
      groups:
        - "platform-engineers"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Multi-tenant business workloads and progressive delivery applications"
  sourceRepos:
    - "*"
  destinations:
    - namespace: "apps"
      server: "https://kubernetes.default.svc"
    - namespace: "production"
      server: "https://kubernetes.default.svc"
    - namespace: "staging"
      server: "https://kubernetes.default.svc"
  # Security Boundary: Workloads are strictly forbidden from creating cluster-scoped resources
  clusterResourceBlacklist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: ""
      kind: "ConfigMap"
    - group: ""
      kind: "Secret"
    - group: ""
      kind: "Service"
    - group: ""
      kind: "ServiceAccount"
    - group: "apps"
      kind: "Deployment"
    - group: "apps"
      kind: "StatefulSet"
    - group: "networking.k8s.io"
      kind: "Ingress"
    - group: "networking.k8s.io"
      kind: "NetworkPolicy"
    - group: "argoproj.io"
      kind: "Rollout"
    - group: "argoproj.io"
      kind: "AnalysisTemplate"
    - group: "autoscaling"
      kind: "HorizontalPodAutoscaler"
    - group: "external-secrets.io"
      kind: "ExternalSecret"
  orphanedResources:
    warn: true
  roles:
    - name: application-developer
      description: Developer deployment privileges restricted to workload namespaces
      policies:
        - p, proj:workloads:application-developer, applications, get, workloads/*, allow
        - p, proj:workloads:application-developer, applications, sync, workloads/*, allow
      groups:
        - "developers"
