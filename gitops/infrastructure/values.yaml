# Global variables for all infrastructure applications
global:
  # IMPORTANT: Update this to match your Git repository URL
  repoURL: "https://github.com/your-org/production-grade-gitops-platform.git"
  targetRevision: "HEAD"
  environment: "production"

# Ingress Nginx Configuration
ingressNginx:
  enabled: true
  namespace: ingress-nginx
  chartVersion: "4.10.0"

# Kube Prometheus Stack Configuration
kubePrometheusStack:
  enabled: true
  namespace: monitoring
  chartVersion: "58.2.2"
  grafanaHost: "grafana.local"
  prometheusHost: "prometheus.local"

# Loki Stack Configuration
lokiStack:
  enabled: true
  namespace: monitoring
  chartVersion: "2.9.11" # Chart for loki-stack containing loki + promtail
  aws:
    # S3 bucket configuration for Loki log storage
    # In production, replace these with output values from Terraform
    s3Bucket: "gitops-eks-prod-loki-storage-bucket"
    s3Region: "us-west-2"
    roleArn: "arn:aws:iam::123456789012:role/gitops-eks-prod-loki-s3-role"

# Cert Manager Configuration
certManager:
  enabled: true
  namespace: cert-manager
  chartVersion: "v1.14.4"
  email: "alert-devops@example.com"

# External DNS Configuration
externalDns:
  enabled: true
  namespace: external-dns
  chartVersion: "1.14.3"

# Metrics Server Configuration
metricsServer:
  enabled: true
  namespace: kube-system
  chartVersion: "3.12.1"

# Cluster Autoscaler Configuration
clusterAutoscaler:
  enabled: true
  namespace: kube-system
  chartVersion: "9.37.0"
  clusterName: "gitops-eks-prod"
  awsRegion: "us-west-2"
  aws:
    roleArn: "arn:aws:iam::123456789012:role/gitops-eks-prod-cluster-autoscaler-role"

# Argo Rollouts Configuration
argoRollouts:
  enabled: true
  namespace: argo-rollouts
  chartVersion: "2.37.2"
