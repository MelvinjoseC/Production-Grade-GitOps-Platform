{{- if .Values.networkPolicies.enabled }}
# ==============================================================================
# Zero-Trust Network Policies for Production Namespace Isolation
# ==============================================================================

# Allow CoreDNS queries from all pods across the cluster
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coredns-egress
  namespace: {{ .Values.ingressNginx.namespace | quote }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Monitoring Namespace: Allow scrape ingress and restrict untrusted pod access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-isolation
  namespace: {{ .Values.kubePrometheusStack.namespace | quote }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-namespace communication (Prometheus <-> Grafana <-> Loki <-> Alertmanager)
    - from:
        - podSelector: {}
    # Allow Ingress NGINX to route to Grafana UI
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingressNginx.namespace }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3000
  egress:
    # Allow intra-namespace communication
    - to:
        - podSelector: {}
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Prometheus to scrape metrics across all namespaces
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 10250 # Kubelet
        - protocol: TCP
          port: 9100  # Node Exporter
        - protocol: TCP
          port: 8080  # Kube-State-Metrics
        - protocol: TCP
          port: 443   # HTTPS endpoints
        - protocol: TCP
          port: 80    # HTTP endpoints
    # Allow Loki to ship logs to AWS S3 & VPC Endpoints
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
# Ingress-NGINX: Allow external public ingress and routing to backend services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-nginx-policy
  namespace: {{ .Values.ingressNginx.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP/HTTPS traffic from anywhere (internet / ALB / NLB)
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
  egress:
    # Allow routing traffic to any pod in any namespace running backend services
    - to:
        - namespaceSelector: {}
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ArgoCD Namespace: Restrict UI access to Ingress and allow Git/K8s API sync
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-isolation
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow internal communication within argocd namespace
    - from:
        - podSelector: {}
    # Allow Ingress NGINX to route to argocd-server
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingressNginx.namespace }}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 443
  egress:
    # Allow internal communication
    - to:
        - podSelector: {}
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound sync to Git repositories and Kubernetes API server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
