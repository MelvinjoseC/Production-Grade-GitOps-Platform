{{- if .Values.podSecurityStandards.enabled }}
# ==============================================================================
# Kubernetes Pod Security Standards (PSA) Admission Control Enforcements
# ==============================================================================

# Workload Namespace: Enforce RESTRICTED profile (highest security benchmark)
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sampleWorkload.namespace | default "apps" | quote }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
# Monitoring Namespace: Enforce BASELINE (Promtail requires hostPath for journal logs)
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.kubePrometheusStack.namespace | quote }}
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
---
# Ingress-NGINX Namespace: Enforce BASELINE (controller binds privileged ports)
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.ingressNginx.namespace | quote }}
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
---
# External-Secrets Namespace: Enforce RESTRICTED
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.externalSecrets.namespace | quote }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
# ArgoCD Namespace: Enforce BASELINE profile
