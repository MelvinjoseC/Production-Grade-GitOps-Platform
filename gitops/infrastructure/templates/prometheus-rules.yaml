{{- if .Values.kubePrometheusStack.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-infrastructure-alerts
  namespace: {{ .Values.kubePrometheusStack.namespace | quote }}
  labels:
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: platform.gitops.rules
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} > 0
          for: 15m
          labels:
            severity: warning
            tier: platform
          annotations:
            summary: "ArgoCD Application {{ $labels.name }} is out of sync"
            description: "Application {{ $labels.name }} has been out of sync for more than 15 minutes. Verify GitOps repository commits and cluster state."

        - alert: ArgoCDAppSyncFailed
          expr: argocd_app_sync_total{phase="Failed"} > 0
          for: 5m
          labels:
            severity: critical
            tier: platform
          annotations:
            summary: "ArgoCD Application {{ $labels.name }} sync failed"
            description: "Application {{ $labels.name }} failed syncing resources. Check ArgoCD application controller logs and sync error messages."

    - name: platform.kubernetes.rules
      rules:
        - alert: KubePodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[10m]) * 60 > 0.5
          for: 5m
          labels:
            severity: critical
            tier: platform
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting rapidly."

        - alert: NodeMemoryPressure
          expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
          for: 10m
          labels:
            severity: warning
            tier: infrastructure
          annotations:
            summary: "Node {{ $labels.instance }} memory usage is above 85%"
            description: "Node memory pressure detected. Cluster Autoscaler may need to provision additional nodes."

        - alert: NodeDiskPressure
          expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} * 100 > 85
          for: 15m
          labels:
            severity: warning
            tier: infrastructure
          annotations:
            summary: "Node {{ $labels.instance }} disk utilization is above 85%"
            description: "Root filesystem on node {{ $labels.instance }} is filling up."

    - name: platform.ingress.rules
      rules:
        - alert: IngressHigh5xxErrorRate
          expr: sum(rate(nginx_ingress_controller_requests{status=~"^5.*"}[5m])) / sum(rate(nginx_ingress_controller_requests[5m])) * 100 > 5
          for: 5m
          labels:
            severity: critical
            tier: ingress
          annotations:
            summary: "Ingress 5xx HTTP error rate is above 5%"
            description: "NGINX Ingress controller is reporting high 5xx error rates across backend services."
{{- end }}
