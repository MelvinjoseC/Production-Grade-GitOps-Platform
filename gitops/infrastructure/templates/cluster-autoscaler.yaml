{{- if .Values.clusterAutoscaler.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: cluster-autoscaler
    repoURL: https://kubernetes.github.io/autoscaler
    targetRevision: {{ .Values.clusterAutoscaler.chartVersion | quote }}
    helm:
      values: |
        autoDiscovery:
          clusterName: {{ .Values.clusterAutoscaler.clusterName | quote }}
        
        awsRegion: {{ .Values.clusterAutoscaler.awsRegion | quote }}
        
        rbac:
          create: true
          serviceAccount:
            name: cluster-autoscaler
            annotations:
              eks.amazonaws.com/role-arn: {{ .Values.clusterAutoscaler.aws.roleArn | quote }}
        
        resources:
          limits:
            cpu: 100m
            memory: 300Mi
          requests:
            cpu: 50m
            memory: 150Mi
        
        extraArgs:
          balance-similar-node-groups: true
          skip-nodes-with-local-storage: false
          expander: least-waste
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.clusterAutoscaler.namespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
