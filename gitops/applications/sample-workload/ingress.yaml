apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api-ingress
  namespace: apps
  annotations:
    ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: demo-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-api-stable
                port:
                  number: 80
