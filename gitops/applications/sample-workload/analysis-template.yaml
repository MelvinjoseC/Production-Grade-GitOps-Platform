apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: apps
spec:
  args:
    - name: service-name
    - name: ingress-name
      value: demo-api-ingress
  metrics:
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(rate(nginx_ingress_controller_requests{ingress="{{args.ingress-name}}",status!~"5.*"}[1m]))
              /
              sum(rate(nginx_ingress_controller_requests{ingress="{{args.ingress-name}}"}[1m]))
            )
    - name: latency-p99
      interval: 30s
      successCondition: result[0] <= 0.500
      failureLimit: 3
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{ingress="{{args.ingress-name}}"}[1m])) by (le))
